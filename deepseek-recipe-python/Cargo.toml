[package]
name = "deepseek-recipe-python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for deepseek-recipe components."
readme = "README.md"
license.workspace = true

[lib]
crate-type = ["cdylib"]
name = "_native"
doc = false

[dependencies]
deepseek-recipe = { workspace = true }
deepseek-recipe-core = { workspace = true }
deepseek-recipe-encoding = { workspace = true }
deepseek-recipe-image = { workspace = true, features = [
    "opencv-preprocess",
    "reqwest-fetch",
] }
futures = { workspace = true }
pyo3 = { version = "0.27", features = ["abi3-py310"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }
